# Dozvon Bot — локальный/прод стек: app (php-fpm) + nginx + mysql + redis + queue + scheduler.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: [db, redis]
    volumes:
      - ./:/var/www/html

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on: [app]
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dozvon}
      MYSQL_USER: ${DB_USERNAME:-dozvon}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Воркер очередей: обзвон, опрос результатов, генерация файлов
  queue:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: [db, redis]
    volumes:
      - ./:/var/www/html
    command: php artisan queue:work --tries=3 --timeout=120

  # Планировщик: payments:poll, premium:expire, checks:dispatch-scheduled, checks:poll-results
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: [db, redis]
    volumes:
      - ./:/var/www/html
    command: php artisan schedule:work

  # Бот (long-polling). Для webhook-режима — отключить и настроить nginx+домен.
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: [db, redis]
    volumes:
      - ./:/var/www/html
    command: php artisan nutgram:run

volumes:
  db-data:
